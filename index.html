<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин Растений</title>
    <!-- Подключаем библиотеку Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Используем системные цвета Telegram для бесшовного дизайна */
        body {
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .product-card {
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .product-title {
            margin: 0 0 5px 0;
            font-size: 18px;
        }
        .product-desc {
            font-size: 14px;
            color: var(--tg-theme-hint-color);
            margin-bottom: 15px;
        }
        .add-btn {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>🌱 Каталог</h2>

    <div class="product-card">
        <h3 class="product-title">Alocasia 'Regal Shields'</h3>
        <p class="product-desc">Адаптированное растение, микроклональное размножение. Отличная генетика.</p>
        <button class="add-btn" onclick="addToCart(1, 'Alocasia', 1500)">Добавить (1500 ₽)</button>
    </div>

    <div class="product-card">
        <h3 class="product-title">Platycerium</h3>
        <p class="product-desc">Папоротник. Выращен in vitro на среде MS, успешно переведен в сфагнум.</p>
        <button class="add-btn" onclick="addToCart(2, 'Platycerium', 2200)">Добавить (2200 ₽)</button>
    </div>

    <script>
        // Инициализируем Telegram Web App
        let tg = window.Telegram.WebApp;
        
        // Разворачиваем окно на всю высоту
        tg.expand(); 
        
        let cart = [];

        function addToCart(id, name, price) {
            cart.push({ id: id, name: name, price: price });
            
            // Настраиваем системную кнопку Telegram в самом низу экрана
            tg.MainButton.setText(`Оформить заказ (${cart.length} шт)`);
            tg.MainButton.show();
        }

        // Что происходит при нажатии на нижнюю кнопку "Оформить заказ"
        tg.MainButton.onClick(function() {
            // Превращаем массив корзины в строку и отправляем обратно в бота
            let data = JSON.stringify(cart);
            tg.sendData(data);
        });
    </script>
</body>
</html>
